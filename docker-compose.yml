name: haftmanzoome

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/haft.db
      STORAGE_DIR: /app/storage
    volumes:
      # پوشه کنار پروژه روی سرور؛ با بازسازی کانتینر پاک نمی‌شود.
      - ./data:/app/data
      - ./storage:/app/storage
      - ./backups:/app/backups
    restart: unless-stopped
