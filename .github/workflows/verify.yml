name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-chars
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: file:./data/haft.db
      SMS_PROVIDER: console
      DEV_EXPOSE_OTP: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, architecture, unit tests
        run: npm run verify

      - name: Migrate and seed SQLite
        run: |
          mkdir -p data storage backups
          npm run db:migrate
          npm run db:seed

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
